<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>v3 · Finance Assistant — прототип «Туман» (ТЗ 1.2)</title>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'"><noscript><link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet"></noscript>
<style>
:root{
  --bg:#F3F3F1; --card:#FFFFFF; --film:#E4E4E0; --ink:#1A1A19; --ink2:#5E5E5A; --line:#DADAD5; --input:#82827C; --ai:#5E5E5A;
  --accent:#1F4B5C; --on-accent:#FFFFFF; --fill:#2D7C93; --ok:#2D6A3E; --soft:#E9EEF0; --stage:#DDE3E6; --warm:#7A5A12;
  --ease-out:cubic-bezier(.23,1,.32,1); --ease-in-out:cubic-bezier(.77,0,.175,1); --ease-drawer:cubic-bezier(.32,.72,0,1);
  --hand:'Caveat','Segoe Script',cursive;
  --f-text:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif; --f-disp:'Onest',system-ui,sans-serif; --d-w:600; --d-ls:-.02em; --d-k:1;
}
:root[data-font="album"]{--f-text:'Golos Text',system-ui,sans-serif; --f-disp:'Literata',Georgia,serif; --d-ls:-.012em; --d-k:1.04}
:root[data-font="even"]{--f-text:'Onest',system-ui,sans-serif; --f-disp:'Onest',system-ui,sans-serif; --d-ls:-.022em; --d-k:1}
:root[data-font="bold"]{--f-text:'Onest',system-ui,sans-serif; --f-disp:'Unbounded','Onest',sans-serif; --d-ls:-.035em; --d-k:.8}
:root[data-theme="dark"]{
  --bg:#121415; --card:#1D2022; --film:#2A2E31; --ink:#F1F0EC; --ink2:#CBCFD2; --line:#53595C; --input:#7C8386; --ai:#CBCFD2;
  --accent:#9AC8D6; --on-accent:#06222B; --fill:#5398AA; --ok:#8BC69D; --soft:#1F2A2E; --stage:#0B0D0E; --warm:#E3C078;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--stage);color:var(--ink);font:400 1rem/1.45 var(--f-text);-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums lining-nums;white-space:nowrap}
.rub{font-weight:400;opacity:.72;margin-left:.06em} .mut .rub{opacity:1}
.disp{font-family:var(--f-disp);font-weight:var(--d-w);letter-spacing:var(--d-ls);line-height:1.1}
.mut{color:var(--ink2)} .sm{font-size:0.875rem} .xs{font-size:0.8125rem}
p{margin:0 0 10px}

.stage{min-height:100%;display:flex;gap:28px;justify-content:center;align-items:flex-start;padding:24px}
.app{position:relative;width:390px;height:800px;flex:none;background:var(--bg);border-radius:28px;overflow:hidden;box-shadow:0 24px 60px -30px rgba(0,0,0,.45)}
.panel{width:270px;flex:none;font-size:0.875rem;color:var(--ink2);max-height:800px;overflow-y:auto}
.panel h2{font:600 0.9375rem/1.2 var(--f-text);color:var(--ink);margin:0 0 10px}
.grp{margin-bottom:12px}.grp>span{display:block;margin-bottom:5px}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.seg button{flex:1;min-height:44px;padding:0 6px;border:0;background:transparent;font-weight:500;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.pbtn{width:100%;min-height:44px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font-weight:500;margin-bottom:6px;text-align:left;padding:0 12px}
.fab{display:none}
@media (max-width:699px){
  .stage{padding:0;display:block}
  .app{width:100%;height:100dvh;border-radius:0;box-shadow:none}
  .panel{position:fixed;right:10px;top:10px;bottom:10px;z-index:80;width:min(290px,calc(100vw - 20px));background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:none;max-height:none}
  .panel.open{display:block}
  .fab{display:grid;place-items:center;position:fixed;right:22px;top:100px;z-index:81;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);opacity:.92}
}

/* экран */
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:18px 16px 150px;scrollbar-width:none}
.view::-webkit-scrollbar{display:none}
.view.notabs{padding-bottom:96px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px;padding-right:0}
.head h1{margin:0;font-size:calc(1.4375rem*var(--d-k))}
.h1{font-size:calc(1.6875rem*var(--d-k));margin:6px 0 8px}
.icon{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center}
.press{transition:transform 160ms var(--ease-out)} .press:active{transform:scale(.97)}
.backb{border:0;background:transparent;min-height:44px;padding:0 8px 0 0;color:var(--ink2);font-weight:500}
.vis{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:12px;margin-left:6px;vertical-align:middle}
.vis.all{background:var(--soft);color:var(--accent)} .vis.me{border:1px dashed var(--line);color:var(--ink2)}

.cardp{background:var(--card);border-radius:4px;padding:10px 10px 0;box-shadow:0 1px 2px rgba(0,0,0,.08),0 14px 30px -16px rgba(0,0,0,.3)}
.photo{position:relative;aspect-ratio:1/1;overflow:hidden;background:var(--film)}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.photo .color{transition:clip-path 700ms var(--ease-in-out)}
.photo .fogfb{filter:blur(8px) saturate(.5) brightness(1.1);transform:scale(1.1)}
.edge{position:absolute;left:0;right:0;top:-34px;height:34px;background:linear-gradient(to top,rgba(255,255,255,.8),rgba(255,255,255,0));transition:transform 700ms var(--ease-in-out);pointer-events:none}
.rule{position:absolute;left:0;right:0;top:0;height:1px;background:rgba(255,255,255,.9);transition:transform 700ms var(--ease-in-out)}
.band{position:absolute;left:0;right:0;top:0;height:10px;background:var(--fill);opacity:0;transition:opacity 300ms var(--ease-out),transform 700ms var(--ease-in-out)}
.bandlab{position:absolute;right:8px;top:0;font-size:0.8125rem;font-weight:600;color:#06222B;background:#CFEAF2;border-radius:11px;padding:2px 9px;opacity:0;transition:opacity 300ms var(--ease-out),transform 700ms var(--ease-in-out)}
.band.show{opacity:.85}.bandlab.show{opacity:1}
.swap{position:absolute;right:8px;bottom:8px;min-height:44px;padding:0 14px;border:0;border-radius:22px;background:rgba(20,22,24,.62);color:#fff;font-size:0.875rem;font-weight:500}
.mile{position:absolute;left:8px;top:8px;font-size:0.8125rem;font-weight:600;color:#06222B;background:rgba(255,255,255,.86);border-radius:10px;padding:3px 9px}
.mile.pop{animation:pop 380ms var(--ease-out)}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
.cap{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:50px;padding:6px 2px 8px}
.cap .hand{font:500 1.4375rem/1 var(--hand)}
.stamp{font-size:0.8125rem;color:var(--ok);border:1px solid currentColor;border-radius:14px;padding:3px 9px;white-space:nowrap}
.stamp.help{color:var(--warm)}
.left{margin:14px 0 2px;font-size:calc(2.125rem*var(--d-k))}
.left small{display:block;font:400 0.9375rem/1.3 var(--f-text);letter-spacing:0;color:var(--ink2);margin-bottom:2px}
.filmlab{display:flex;justify-content:space-between;font-size:0.8125rem;color:var(--ink2);margin:12px 0 4px}
.film{display:grid;grid-template-columns:repeat(13,1fr);gap:3px;background:var(--film);padding:5px 4px;border-radius:4px}
.fr{aspect-ratio:22/28;border-radius:2px;background:var(--card);position:relative;overflow:hidden}
.fr::after{content:'';position:absolute;inset:0;background:var(--fill);clip-path:inset(0 var(--r,100%) 0 0);transition:clip-path 320ms var(--ease-out)}
.fr:last-child{outline:2px solid var(--ink);outline-offset:-2px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.wd{text-align:center;font-size:0.8125rem;color:var(--ink2)}
.wd i{display:block;height:22px;border-radius:4px;background:var(--film);margin-bottom:2px;position:relative}
.wd.on i{background:var(--fill)} .wd.both i::after{content:'';position:absolute;right:3px;top:3px;width:7px;height:7px;border-radius:50%;background:var(--card)}
.wd.now i{outline:2px solid var(--ink);outline-offset:1px}

.sec{margin-top:20px;border-top:1px solid var(--line);padding-top:14px}
.sec>h2,.lbl{font:500 0.8125rem/1.3 var(--f-text);color:var(--ink2);margin:0 0 6px}
.big{font-size:calc(1.875rem*var(--d-k));margin:0}
.rowl{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:48px;padding:6px 0;border-bottom:1px solid var(--line)}
.rowl:last-child{border-bottom:0}
.rowl>span:first-child{flex:1;min-width:0}
.field{display:flex;gap:8px;align-items:center}
.inp{flex:1;min-width:0;width:100%;min-height:48px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
textarea.inp{padding:12px 14px;min-height:96px;resize:none;line-height:1.4}
.inp.miss{border-color:var(--warm);box-shadow:0 0 0 2px color-mix(in srgb,var(--warm) 25%,transparent)}
.go{flex:none;min-height:48px;padding:0 16px;border:0;border-radius:12px;background:var(--ink);color:var(--bg);font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.chip{min-height:44px;padding:6px 14px;border:1px solid var(--line);border-radius:22px;background:var(--card);text-align:left;line-height:1.25}
.link{border:0;background:transparent;color:var(--accent);padding:0;min-height:44px;font-weight:500;text-align:left}
.ans{margin:10px 0 0;font-weight:500;min-height:1.45em}
.note{background:var(--soft);border-radius:12px;padding:10px 12px;margin:10px 0}
.ai{color:var(--ai);font-style:italic}
.bottom{position:absolute;left:0;right:0;bottom:64px;padding:10px 16px 10px;background:linear-gradient(to top,var(--bg) 78%,transparent);z-index:5}
.bottom.notabs{bottom:0;padding-bottom:calc(14px + env(safe-area-inset-bottom))}
.main{display:block;width:100%;min-height:54px;border:0;border-radius:14px;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:1.0625rem}
.main[disabled]{opacity:.55;cursor:default}
.sec2{display:block;width:100%;min-height:50px;border:1px solid var(--line);border-radius:14px;background:var(--card);font-weight:500;margin-top:8px}
.tabs{position:absolute;left:0;right:0;bottom:0;height:64px;display:flex;background:var(--card);border-top:1px solid var(--line);z-index:6;padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;border:0;background:transparent;color:var(--ink2);font-weight:500;font-size:0.875rem}
.tabs button[aria-current="page"]{color:var(--ink);box-shadow:inset 0 2px 0 var(--accent)}
.fb{position:absolute;right:12px;bottom:calc(64px + 78px);z-index:4;border:0;background:transparent;color:var(--ink2);font-size:0.8125rem;min-height:44px;padding:0 6px;text-decoration:underline}
.pl{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);width:100%;border-left:0;border-right:0;border-top:0;background:transparent;text-align:left}
.pl .mini{position:relative;width:64px;height:64px;flex:none;border-radius:4px;overflow:hidden;background:var(--film)}
.pl .mini img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

/* лист */
.back{position:absolute;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity 250ms var(--ease-out);z-index:30}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow-y:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:10px 16px 20px;transform:translateY(100%);transition:transform 380ms var(--ease-drawer);z-index:31}
.open>.back{opacity:1;pointer-events:auto}.open>.sheet{transform:translateY(0)}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sheet h3{font-size:calc(1.3125rem*var(--d-k));margin:0 0 8px}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.thumbs button{position:relative;aspect-ratio:1;border:0;padding:0;border-radius:6px;overflow:hidden;background:var(--film)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.filebtn{position:relative;display:flex;align-items:center;justify-content:center;min-height:50px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-weight:500;overflow:hidden;margin-top:8px}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.tip{display:flex;gap:10px;align-items:center;min-height:52px;padding:6px 0;border-bottom:1px solid var(--line)}
.tip input{width:22px;height:22px;accent-color:var(--accent);flex:none}.tip span{flex:1}
.scan{height:4px;border-radius:2px;background:var(--film);overflow:hidden;margin:14px 0}
.scan i{display:block;height:100%;width:40%;background:var(--fill);animation:scan 900ms linear infinite}
@keyframes scan{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
details{border-bottom:1px solid var(--line);padding:6px 0}
summary{min-height:44px;display:flex;align-items:center;cursor:pointer;font-weight:500}

/* уведомление и чат */
.push{position:absolute;left:10px;right:10px;top:10px;z-index:40;background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:0 14px 34px -12px rgba(0,0,0,.45);animation:drop 420ms var(--ease-out)}
@keyframes drop{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:none}}
.push .row{display:flex;gap:8px;margin-top:10px}
.push .row button{flex:1;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:500}
.chat{display:flex;flex-direction:column;gap:8px}
.bub{max-width:86%;padding:9px 12px;border-radius:16px 16px 16px 4px;background:var(--card);align-self:flex-start;font-size:0.9375rem}
.bub.me{align-self:flex-end;border-radius:16px 16px 4px 16px;background:var(--soft)}
.bub small{display:block;font-size:0.8125rem;color:var(--ink2);margin-top:4px}
.kb{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.kb button{min-height:44px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:500;font-size:0.875rem}
.chathead{display:flex;align-items:center;gap:10px;margin:-18px -16px 12px;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:-18px;z-index:3}
.ava{width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:700}

/* сторис */
.story{position:absolute;inset:0;z-index:50;background:#16323D;color:#fff;display:none}
.story.on{display:block}
.story .pic{position:absolute;inset:0}.story .pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.story .pic .color{transition:clip-path 1400ms var(--ease-in-out)}
.story .shade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(10,22,28,.72),rgba(10,22,28,.18) 42%,rgba(10,22,28,.8))}
.segs{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:4px;z-index:3}
.segs i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.35);overflow:hidden}
.segs i b{display:block;height:100%;background:#fff;transform:scaleX(0);transform-origin:left}
.segs i.done b{transform:scaleX(1)} .segs i.run b{animation:seg 4600ms linear forwards}
.story.paused .segs i.run b{animation-play-state:paused}
@keyframes seg{to{transform:scaleX(1)}}
.skip{position:absolute;top:26px;right:12px;z-index:4;min-height:44px;padding:0 16px;border:0;border-radius:22px;background:rgba(255,255,255,.18);color:#fff;font-weight:500}
.stxt{position:absolute;left:20px;right:20px;top:86px;z-index:2}
.stxt h2{margin:0 0 10px;font-size:calc(2.25rem*var(--d-k));color:#fff;text-wrap:balance}
.stxt p{font-size:1.0625rem;line-height:1.4;max-width:30ch}
.sbot{position:absolute;left:20px;right:20px;bottom:28px;z-index:4}
.sbot .hint{font-size:0.8125rem;opacity:.8;text-align:center}
.sbot .main{background:#fff;color:#16323D}
.tapz{position:absolute;top:80px;bottom:120px;z-index:3;background:transparent;border:0}
.tapz.l{left:0;width:36%}.tapz.r{right:0;width:64%}
.enter{animation:enter 420ms var(--ease-out) both}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

@media (prefers-reduced-motion:reduce){
  .photo .color,.edge,.rule,.band,.bandlab,.fr::after,.sheet,.back,.story .pic .color{transition-duration:1ms}
  .enter,.push,.mile.pop{animation:none}.scan i{animation:none;width:100%}
  .segs i.run b{animation:none;transform:scaleX(1)} .press:active{transform:none}
}

/* расстояние между буквами зависит от размера: мелкому тексту — чуть шире */
.xs,.sm,.lbl,.vis,.wd,.filmlab,.stamp,.tabs button{letter-spacing:.01em}
/* навигация и главная кнопка — полупрозрачный слой, содержимое прокручивается под ним */
.tabs{background:color-mix(in srgb,var(--card) 80%,transparent);-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%)}
.bottom{background:color-mix(in srgb,var(--bg) 70%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
@media (prefers-reduced-transparency:reduce){.tabs{background:var(--card);-webkit-backdrop-filter:none;backdrop-filter:none}.bottom{background:var(--bg);-webkit-backdrop-filter:none;backdrop-filter:none}.swap{background:#141618}.mile{background:#fff}}
/* больше контраста: плотные границы, чёткая линия тумана и подпись доли */
.pctlab{display:none;position:absolute;left:8px;bottom:8px;font-size:.8125rem;font-weight:600;color:#06222B;background:#fff;border-radius:10px;padding:3px 9px}
@media (prefers-contrast:more){
  :root{--line:#6E6E69;--input:#6E6E69;--ink2:#1A1A19;--ai:#1A1A19} :root[data-theme="dark"]{--line:#B9BCBA;--input:#B9BCBA;--ink2:#F1F0EC;--ai:#F1F0EC}
  .rule{height:3px;background:#fff;box-shadow:0 0 0 1px #000} .pctlab{display:block} .vis.me{border-style:solid} .thin{background-color:rgba(255,255,255,.5)}
  .inp,.chip,.sec2,.icon{border-width:2px}
}
/* отмечено, но ещё не подтверждено выпиской — лёгкая дымка со штриховкой */
.thin{position:absolute;left:0;right:0;background-color:rgba(255,255,255,.3);background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.28) 0 6px,transparent 6px 12px);pointer-events:none}
.stamp small{display:block;font-size:.8125rem;opacity:.9}
/* сообщение, которое исчезает само */
.toast{position:absolute;left:16px;right:16px;bottom:146px;z-index:45;background:var(--ink);color:var(--bg);border-radius:12px;padding:11px 14px;font-size:.9375rem;opacity:0;transform:translateY(8px);transition:opacity 200ms var(--ease-out),transform 200ms var(--ease-out);pointer-events:none}
.toast.on{opacity:1;transform:none}
/* лист тянется за пальцем */
.grabz{display:flex;justify-content:center;align-items:center;height:30px;margin:-10px -16px 2px;touch-action:none;cursor:grab}
.grabz .grab{margin:0}
.sheet.drag{transition:none}
/* кнопка занята */
.main[aria-busy="true"],.go[aria-busy="true"]{opacity:.75}
.main[aria-busy="true"]::after{content:'';display:inline-block;width:14px;height:14px;margin-left:10px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;vertical-align:-2px;animation:spin 700ms linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.main[aria-busy="true"]::after{animation:none}.toast{transition-duration:1ms}}
.askrow{width:100%;justify-content:space-between;background:none;border:0;border-top:1px solid var(--line);padding:14px 0;font:inherit;color:inherit;text-align:left;cursor:pointer}
/* v3 · flow_group */

.v3-tag{display:inline-block;font-size:.8125rem;font-weight:600;letter-spacing:.01em;color:var(--accent);background:var(--soft);border-radius:10px;padding:2px 9px;margin:0 0 6px}
.v3-tag.v3-exbadge{font-size:.9375rem;padding:4px 12px;border:1.5px dashed currentColor;border-radius:12px}
.v3-example .cardp{outline:1.5px dashed var(--ink2);outline-offset:4px;box-shadow:none}
.v3-exnote{margin:12px 0 0;font-weight:500}
.v3-row{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:8px}
.v3-pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:18px 0 10px}
.v3-pair .sec2{margin-top:0;min-height:54px;font-weight:600}
.v3-big{font-size:calc(1.5rem*var(--d-k));margin:0 0 8px}
.v3-tl{position:relative;padding-top:20px;margin-top:6px}
.v3-time{position:relative;height:6px;border-radius:3px;background:var(--film)}
.v3-time i{position:absolute;top:-4px;width:2px;height:14px;margin-left:-1px;border-radius:1px;background:var(--ink2)}
.v3-tnow{position:absolute;top:0;white-space:nowrap}
.v3-timelab{display:flex;justify-content:space-between;margin:4px 0 6px}
.v3-steps{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin:2px 0 6px}
.v3-steps i{height:10px;border-radius:2px;background:var(--film)} .v3-steps i.on{background:var(--fill)}
.v3-members{margin:10px 0 4px}
.v3-member,.v3-gonerow{display:flex;align-items:center;gap:10px;min-height:52px;padding:6px 0;border-bottom:1px solid var(--line)}
.v3-member>span:nth-child(2),.v3-gonerow>span:nth-child(2){flex:1;min-width:0}
.v3-gonerow{color:var(--ink2)}
.v3-ava{width:32px;height:32px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--accent);font-weight:600}
.v3-st{font-size:.8125rem;letter-spacing:.01em;color:var(--ok);border:1px solid currentColor;border-radius:14px;padding:3px 9px;white-space:nowrap}
.v3-st.wait,.stamp.wait,.stamp.v3-plain{color:var(--ink2)}
.v3-stampw{display:inline-flex;align-items:center;white-space:nowrap}
.v3-legend .vis{margin-left:0}
.v3-invite .photo{aspect-ratio:2/1}
.v3-invite .sec p{margin:2px 0 10px}
.v3-invite .sec p .vis{margin-left:2px}
.v3-pad{height:60px}

/* v3 · motivation */

.v3-wk{display:grid;grid-template-columns:repeat(13,1fr);gap:3px;margin:6px 0 6px}
.v3-day{height:14px;border-radius:3px;background:var(--film)}
.v3-day.on{background:var(--fill)}
.v3-day.v3-now{outline:2px solid var(--ink);outline-offset:1px}
.v3-wkline{margin:8px 0 0}
.v3-pair .sec2 small{display:block;font-weight:400;font-size:.875rem;letter-spacing:0;color:var(--ink2);margin-top:2px}
.v3-pair .sec2 small .num{color:var(--ink);font-weight:600}
.v3-prop{margin:10px 0}
.v3-sliplink{display:block;min-height:44px;margin:4px 0 0}
.v3-shelf{display:flex;gap:10px;overflow-x:auto;margin:6px 0 8px;scrollbar-width:none}
.v3-shelf figure{margin:0;width:84px;flex:none}
.v3-shelf .mini{position:relative;display:block;width:84px;height:84px;border-radius:4px;overflow:hidden;background:var(--film)}
.v3-shelf .mini img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.v3-shelf figcaption{font-size:.8125rem;letter-spacing:.01em;line-height:1.3;color:var(--ink2);margin-top:4px}
.push .v3-bank{margin-top:4px}

/* v3 · distill */
.ico{flex:none;width:48px;min-height:48px;display:grid;place-items:center;border:0;border-radius:12px;background:var(--film);color:var(--ink)}
.go2{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
[data-out="left-today"]{font-size:calc(2.5rem*var(--d-k))}
/* v3 · fixes */
.v3-pair{grid-template-columns:repeat(auto-fit,minmax(min(100%,9.5rem),1fr))}
.v3-theme .seg{flex-wrap:wrap}.v3-theme .seg button{flex:1 1 6rem}
.rowl,.cap,label.tip{flex-wrap:wrap}
.chip{max-width:100%;overflow-wrap:anywhere}
button.link[style*="min-height:0"]{min-height:24px!important;padding-block:2px}
.vis{width:26px;height:26px;border-radius:13px}.vis svg{transform:scale(1.15)}
.fx-leg{display:inline-flex;align-items:center;gap:6px;margin-top:4px}.fx-leg .vis{margin-left:0}
/* v3 · theme */

/* фото цели в тёмной теме — темнее сама картинка */
:root[data-theme="dark"] .photo img.color,:root[data-theme="dark"] .mini img.color,:root[data-theme="dark"] .story .pic img.color{filter:brightness(.88)}
/* туман в тёмной теме: вуаль из цвета поверхности; запасной вариант (пока копия не готова) — тоже темнее, а не светлее */
:root[data-theme="dark"] .photo .fogfb{filter:blur(8px) saturate(.5) brightness(.55)}
:root[data-theme="dark"] .edge{background:linear-gradient(to top,color-mix(in srgb,var(--card) 80%,transparent),transparent)}
:root[data-theme="dark"] .rule{background:color-mix(in srgb,var(--ink) 70%,transparent)}
:root[data-theme="dark"] .thin{background-color:color-mix(in srgb,var(--card) 30%,transparent);background-image:repeating-linear-gradient(135deg,color-mix(in srgb,var(--card) 34%,transparent) 0 6px,transparent 6px 12px)}
@media (prefers-contrast:more){:root[data-theme="dark"] .thin{background-color:color-mix(in srgb,var(--card) 50%,transparent)}}
/* уровни поверхностей: страница → карточка/лист → рамка */
:root[data-theme="dark"] .sheet{background:var(--card);box-shadow:inset 0 1px 0 var(--line)}
:root[data-theme="dark"] .cardp{box-shadow:0 0 0 1px var(--line),0 14px 30px -16px rgba(0,0,0,.6)}
/* ярче всего на экране — только главная кнопка .main */
:root[data-theme="dark"] .go:not(.go2){background:var(--film);color:var(--ink);box-shadow:inset 0 0 0 1px var(--input)}
/* вторичная .go2 (distill) — тот же контур без заливки: белый контур 1,5 px был заметнее основной «Записать» */
:root[data-theme="dark"] .go2{box-shadow:inset 0 0 0 1px var(--input)}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{background:var(--film);color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink2)}
:root[data-theme="dark"] .toast{background:var(--card);color:var(--ink);box-shadow:0 0 0 1px var(--line),0 12px 28px -12px rgba(0,0,0,.6)}
/* плавная смена темы — только пока на <html> висит .theme-anim (ставит JS на 250 мс), при загрузке перехода нет */
@media (prefers-reduced-motion:no-preference){
  :root{--th-t:background-color 200ms var(--ease-out),color 200ms var(--ease-out),border-color 200ms var(--ease-out)}
  .theme-anim body,.theme-anim .app,.theme-anim .cardp,.theme-anim .bottom,.theme-anim .tabs,.theme-anim .tabs button,.theme-anim .panel,
  .theme-anim .seg,.theme-anim .seg button,.theme-anim .sec,.theme-anim .rowl,.theme-anim .mut,.theme-anim .chip,.theme-anim .bub,
  .theme-anim .go,.theme-anim .inp{transition:var(--th-t)}
  .theme-anim .sheet{transition:transform 380ms var(--ease-drawer),var(--th-t)}
  .theme-anim .press{transition:transform 160ms var(--ease-out),var(--th-t)}
  .theme-anim .toast{transition:opacity 200ms var(--ease-out),transform 200ms var(--ease-out),var(--th-t)}
}
.v3-theme .seg button{line-height:1.2;padding:4px 6px}

/* v3 · anim */

/* строка 1 — ответ Э-05 */
.v3-line{animation:v3-line 240ms var(--ease-out) both;animation-delay:var(--v3-d,0ms)}
@keyframes v3-line{from{opacity:0;transform:translateY(6px)}}
.v3-pop,.v3-line.v3-pop{animation:pop 380ms var(--ease-out) both;animation-delay:var(--v3-d,0ms)}
/* строка 2 — смена суммы */
.v3-ib{display:inline-block}
.v3-mout{animation:v3-mout 160ms var(--ease-out) forwards}
@keyframes v3-mout{to{opacity:0;transform:translateY(-6px)}}
.v3-min{animation:v3-min 200ms var(--ease-out) both}
@keyframes v3-min{from{opacity:0;transform:translateY(6px)}}
/* строка 3 — пример → своя цель */
.view.v3-ghost{pointer-events:none;z-index:1;transform-origin:50% 30%;animation:v3-ghost 200ms var(--ease-out) forwards}
@keyframes v3-ghost{to{opacity:0;transform:scale(.98)}}
.view.v3-ex-in{animation:v3-ex-in 280ms var(--ease-out) both}
@keyframes v3-ex-in{from{opacity:0;transform:translateY(12px)}}
/* строка 5 — новый участник */
.v3-member.v3-join{animation:v3-join 240ms var(--ease-out) both}
@keyframes v3-join{from{opacity:0;transform:scale(.96)}}
/* строка 6 — ячейка дня */
.wd.on i.v3-filling{background:var(--film)}
.v3-fillbar{position:absolute;inset:0;border-radius:inherit;background:var(--fill);animation:v3-fill 320ms var(--ease-out) both}
.v3-day.v3-fill{animation:v3-fill 320ms var(--ease-out) both}
@keyframes v3-fill{from{clip-path:inset(100% 0 0 0)}to{clip-path:inset(0)}}
/* строка 7 — проявление экрана */
.view.v3-vin{animation:v3-vin 120ms var(--ease-out)}
@keyframes v3-vin{from{opacity:.6}}
@keyframes v3-fade{from{opacity:0}}
@keyframes v3-fade-out{to{opacity:0}}

@media (prefers-reduced-motion:reduce){
  .v3-line,.v3-pop,.v3-line.v3-pop,.v3-member.v3-join,.v3-min,.view.v3-ex-in{animation:v3-fade 120ms var(--ease-out) both;animation-delay:0ms}
  .v3-mout{animation:none}
  .view.v3-ghost{animation:v3-fade-out 120ms var(--ease-out) forwards}
  .v3-fillbar{display:none} .wd.on i.v3-filling{background:var(--fill)} .v3-day.v3-fill{animation:none}
  .view.v3-vin{animation:none}
}

/* v3 · palette */
.v3-tag,.vis.all{color:var(--ink2)}
.v3-ava{color:var(--ink)}
.inp{border:1.5px solid var(--input)}
@media (prefers-contrast:more){.inp{border-width:2px}}
/* v3 · pult */
html.v3-clean #fab,html.v3-clean #panel{display:none!important}
/* v3 · harden */

.v3h-err{margin:6px 0 0;font-size:.875rem;line-height:1.35;color:var(--warm)}
.inp[aria-invalid="true"]{border-color:var(--warm);box-shadow:0 0 0 2px color-mix(in srgb,var(--warm) 25%,transparent)}
#income-hint{margin:0 0 6px}
/* подпись строки не сжимается под сумму: сумма переносится сама */
.rowl>span:first-child{min-width:min-content}
.rowl>b.num{white-space:normal;text-align:right;min-width:0}
/* «Где лежат деньги» — строка, а не системная кнопка */
button.v3-where{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;color:var(--ink);font:inherit;text-align:left;cursor:pointer}
/* «Сменить фото» слева: подпись «отложено» едет справа и её не перекрывает */
.photo .swap{right:auto;left:8px}
/* фокус и прокрутка не уводят элемент под закреплённую нижнюю зону */
.view{scroll-padding-bottom:180px}
/* текст 200 %: вкладки переносятся, крупные числа не вылезают за край */
.tabs button{white-space:normal;line-height:1.15;padding:0 2px}
.big{font-size:min(calc(1.875rem*var(--d-k)),12vw)}
[data-out="left-today"]{font-size:min(calc(2.5rem*var(--d-k)),14vw)}
/* альбомная ориентация телефона — как узкий экран, нижняя зона компактнее */
@media (max-height:500px) and (orientation:landscape){
  .stage{padding:0;display:block}
  .app{width:100%;height:100dvh;border-radius:0;box-shadow:none}
  .panel{position:fixed;right:10px;top:10px;bottom:10px;z-index:80;width:min(290px,calc(100vw - 20px));background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:none;max-height:none}
  .panel.open{display:block}
  .fab{display:grid;place-items:center;position:fixed;right:22px;top:20px;z-index:81;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);opacity:.92}
  .tabs{height:52px}.bottom{bottom:52px;padding:6px 16px}.bottom .main{min-height:44px}.bottom .sec2{min-height:44px;margin-top:4px}
  .view{scroll-padding-bottom:120px}
  .bottom{display:flex;gap:8px;align-items:stretch}.bottom .main,.bottom .sec2{flex:1 1 0;margin-top:0}
}
/* область касания ссылок-действий — 44 px, вёрстка не меняется */
button.link{position:relative}
button.link::after{content:'';position:absolute;inset:-10px -6px}
/* текст 200 %: заголовок истории переносится, вкладки не слипаются */
.stxt h2{overflow-wrap:anywhere;hyphens:auto;font-size:min(calc(2.25rem*var(--d-k)),10vw)}
.tabs button{font-size:min(.875rem,3.6vw)}

/* v3 · polish */

/* 2. ошибка в форме полей — у своего поля, а не у следующей подписи */
#fieldsf .v3h-err{margin:-6px 0 12px}
/* 5. кнопки-ссылки — цель касания 44 px (WCAG 2.5.8); инлайновый min-height:0 перекрыт */
button.link,button.link[style*="min-height:0"]{min-height:44px !important;display:inline-flex;align-items:center;vertical-align:middle}
/* поле и кнопки рядом: при крупном тексте кнопки уходят на новую строку, поле не сжимается до «потр» */
form.field{flex-wrap:wrap}
form.field>.inp{flex:1 1 8em;min-width:0}
/* подписи вкладок растут вместе с текстом; высота — по содержимому */
.tabs{height:auto !important;min-height:64px}
.tabs button{font-size:max(.75rem,min(.875rem,3.6vw)) !important;padding:6px 2px !important}
@media (max-height:500px) and (orientation:landscape){
  .tabs{min-height:52px}
  /* строка не растягивается на всю ширину альбомного экрана */
  .view{padding-left:max(16px,calc((100% - 640px) / 2));padding-right:max(16px,calc((100% - 640px) / 2))}
}
/* низкий экран (320×568, альбомная): фото цели не выталкивает сумму «Осталось отложить» за край */
@media (max-height:700px){.cardp .photo{aspect-ratio:auto;height:34vh}}
/* нижняя зона в потоке, когда она выше трети экрана */
.view .bottom.p-flow{position:static;background:none;-webkit-backdrop-filter:none;backdrop-filter:none;padding:16px 0 0;display:block}
.view .bottom.p-flow .sec2{margin-top:8px}
/* тост — сверху: не закрывает главную кнопку и заголовок листа */
.toast{bottom:auto !important;top:calc(10px + env(safe-area-inset-top));transform:translateY(-8px)}
.toast.on{transform:none}
/* одна главная заливка: «Дальше», «Записать», «Код» — как главная кнопка */
.go{background:var(--accent);color:var(--on-accent)}
/* опасное действие — не как обычная главная кнопка */
.main.p-danger{background:transparent;color:var(--warm);border:2px solid var(--warm)}
.p-leg{display:flex;align-items:center;gap:6px;margin:4px 0 0}.p-leg .vis{margin-left:0}

/* v3 · login */

/* зелёный Сбера темнее фирменного #21A038 (3,41:1): белый текст 5,13:1 по WCAG AA; в продукте кнопку рисует SDK Сбер ID */
.l-sber{background:#107F2C !important;color:#fff !important}
:root[data-theme="dark"] /* зелёный Сбера темнее фирменного #21A038 (3,41:1): белый текст 5,13:1 по WCAG AA; в продукте кнопку рисует SDK Сбер ID */
.l-sber{background:#107F2C !important;color:#fff !important}
#sheet .l-btn{text-align:left;padding:0 16px}

/* v3 · polish2 */

/* плёнка — 7 кадров по дням недели, той же высоты, что прежние 13 */
.film{grid-template-columns:repeat(7,1fr)}
.film .fr{aspect-ratio:7/4}
.fr:last-child{outline:none}
/* значки видимости без общих целей ничего не различают */
.p-solo #view .vis:not(.p-keep){display:none}
/* тост — над нижней зоной */
.toast{top:auto !important;bottom:var(--p-tb,146px) !important;transform:translateY(8px)}
.toast.on{transform:none}
/* длинное название цели переносится, а не уходит за край */
.ai,.head h1,.cap .hand{overflow-wrap:anywhere}
/* панель вкладок не просвечивает (WebKit) */
.tabs{background:var(--card) !important}

</style>
</head>
<body>
<div class="stage">
  <div class="app" id="app" data-who="oleg" data-day="today">
    <div class="view" id="view"></div>
    <div id="bottom"></div>
    <nav class="tabs" id="tabs" aria-label="Разделы"></nav>
    <div id="pushwrap"></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div id="sheetwrap"><div class="back" id="back"></div><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Лист"></div></div>
    <div class="story" id="story" aria-label="Знакомство">
      <div class="pic"><img class="fog" alt=""><img class="color" alt=""></div><div class="shade"></div>
      <div class="segs" id="segs"></div><button class="skip" id="skip">Пропустить</button>
      <div class="stxt" id="stxt"></div>
      <button class="tapz l" id="sprev" aria-label="Назад"></button><button class="tapz r" id="snext" aria-label="Дальше"></button>
      <div class="sbot" id="sbot"></div>
    </div>
  </div>

  <aside class="panel" id="panel" aria-label="Пульт прототипа">
    <h2>Пульт прототипа</h2>
    <div class="grp"><span>С чего начать</span>
      <button class="pbtn" data-sc="fresh">Первый вход: знакомство, согласие и пример</button>
      <button class="pbtn" data-sc="mid">Через три месяца: покупка в работе</button></div>
    <div class="grp"><span>День</span><div class="seg"><button data-day="today">Сегодня</button><button data-day="tomorrow">Завтра</button></div></div>
    <div class="grp"><span>Чей экран</span><div class="seg"><button data-who="oleg">Олег</button><button data-who="anya">Аня</button></div></div>
    <div class="grp"><span>События</span>
      <button class="pbtn" data-sc="payday">День зарплаты: уведомление</button>
      <button class="pbtn" data-sc="partner">Партнёр отложил сегодня</button>
      <button class="pbtn" data-sc="price">Цена по ссылке изменилась</button>
      <button class="pbtn" data-sc="week">Воскресенье: итоги недели</button>
      <button class="pbtn" data-sc="recon">Сверка с выпиской: расхождение</button>
      <button class="pbtn" data-sc="done">Покупка собрана</button></div>
    <div class="grp"><span>Сбои и отказы</span>
      <button class="pbtn" data-sc="offline">Нет сети</button>
      <button class="pbtn" data-sc="limit">Лимит запросов к модели</button>
      <button class="pbtn" data-sc="format">Чужой формат выписки</button>
      <button class="pbtn" data-sc="botoff">Бот отключён</button>
      <button class="pbtn" data-sc="used">Приглашение уже использовано</button></div>
    <div class="grp"><span>Р2: вход и общая цель</span>
      <button class="pbtn" data-sc="example">Пример цели после согласия</button>
      <button class="pbtn" data-sc="solo">Своя цель одного человека</button>
      <button class="pbtn" data-sc="together">«Копить вместе с кем-то?»</button>
      <button class="pbtn" data-sc="groupInvite">Приглашение в общую цель</button>
      <button class="pbtn" data-sc="group2">Общая цель на двоих</button>
      <button class="pbtn" data-sc="group2step">На двоих: второй сделал шаг</button>
      <button class="pbtn" data-sc="group3">Общая цель на четверых</button></div>
    <div class="grp"><span>Р2: мотивация</span>
      <button class="pbtn" data-sc="dayprice">«Влезет ли» с ценой в днях цели</button>
      <button class="pbtn" data-sc="slip">Взяли из отложенного</button>
      <button class="pbtn" data-sc="slipPropose">Предложение нового срока (глазами Ани)</button>
      <button class="pbtn" data-sc="weeks">Счёт недель по плану</button>
      <button class="pbtn" data-sc="weeksum3">Итоги недели в общей цели</button>
      <button class="pbtn" data-sc="nextgoal">Собрано — следующая цель</button>

function scrClarify(){ const d = S.draft, q = d.twoPrices ? ['На странице две цены — какую брать?', 'price', d.twoPrices.map(v => fmt(v))] : d.linkFail && d.price == null ? ['Страница товара не открылась. Сколько стоит?', 'price', ['40 000','100 000']] : d.price == null ? ['Сколько стоит?', 'price', ['40 000','100 000']] : d.dl == null ? ['К какой дате?', 'dl', ['к 15 ноября','к 31 декабря','к 1 июня']] : ['Сколько вносите вы?', 'share', ['половину','плачу сам']];

function scrFields(){ const d = S.draft || {}; const f = (id, lab, val, miss) => `<label class="lbl" for="f-${id}">${lab}</label><input class="inp${miss ? ' miss' : ''}" id="f-${id}" value="${esc(val)}" style="margin-bottom:10px">`;

function scrAnswer(){ const d = S.draft, days = Math.max(1, Math.round((d.dl - now()) / DAY)), gap = Math.max(0, d.price - d.share), per = Math.ceil(d.share / days), solo = gap === 0;

  main:[solo ? 'К моей покупке' : 'Отправить партнёру', solo ? 'commit' : 'toShare'], extra: solo ? '' : '<button class="sec2 press" data-act="commit">К моей покупке</button>'}; }

function scrShare(){ const p = P(); const txt = `${p.cap || p.name} к ${dStr(p.dl)}, ${rubT(p.price)}. ${rubT(p.share[p.owner])} беру на себя. Посмотри, сможешь ли добавить, — там видно только покупку, а не мои деньги.`;
  return {notabs:true, html:`${backBtn('purchase', 'К покупке')}<h1 class="h1 disp">Отправить партнёру</h1><div class="note" id="sharetxt">${txt}<br><span class="mut">fa.example/p/7Kq2…</span></div>

  <p class="xs mut" style="margin-top:10px">Ссылка одноразовая: примет приглашение один человек.</p>`, main:['Отправить','shareSend']}; }

function scrList(){ const w = S.who, ps = S.purchases.filter(p => p.share[w] != null || p.owner === w || p.invited);
  return {html:`<div class="head"><h1 class="disp">Покупки</h1><button class="icon press" data-go="phrase" aria-label="Новая покупка"><svg width="20" height="20" viewBox="0 0 20 20"><path d="M10 3v14M3 10h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button></div>
  ${ps.map(p => `<button class="pl press" data-open="${p.id}"><span class="mini" data-pic="${p.photo}" data-pct="${pctOf(p, w)}"><img class="fog" alt=""><img class="color" alt=""></span>
  <span><b>${esc(p.name)}</b><br><span class="mut sm">к ${fxDl(p.dl)} · ${p.state === 'done' ? 'собрано' : p.share[w] == null ? 'ждёт вашей части' : 'осталось ' + rubT(leftOf(p, w))}</span></span></button>`).join('') || '<p class="mut">Покупок пока нет.</p>'}`, main:['Новая покупка','newPurchase']}; }

function weekRow(w){ const wk = S.people[w].week.slice(), ow = S.people[OTHER[w]].week.slice(), todayI = 3 + S.off;
  if (S.off) { wk[3] = 1; ow[3] = 1; }
  wk[todayI] = S.people[w].stepped ? 1 : 0; ow[todayI] = (S.flags.partnerStep ? 1 : 0);
  const done = wk.filter(Boolean).length;
  return {done, html:`<div class="week" aria-label="Шаги этой недели">${['пн','вт','ср','чт','пт','сб','вс'].map((d, i) => `<div class="wd${wk[i] ? ' on' : ''}${wk[i] && ow[i] ? ' both' : ''}${i === todayI ? ' now' : ''}"><i></i>${d}</div>`).join('')}</div>`}; }

function scrPurchase(){ const p = P(), w = S.who, o = OTHER[w];

  const pc = pctOf(p, w), ml = mileOf(pc), wk = weekRow(w), gap = gapOf(p), over = overOf(p), mine = perDay(p, w), plan = onPlan(p, w);
  const oStat = p.gone === o ? 'вышел' : p.share[o] == null ? (p.invited ? 'приглашение отправлено' : 'ещё не знает') : !(p.saved[o] > 0) ? 'только начали' : onPlan(p, o) ? 'по плану' : 'нужна помощь';
  const steps = Math.min(7, wk.done), ask = !me().asked && p.owner === w;

  <button class="icon press" data-sheet="change" aria-label="Изменить покупку"><svg width="20" height="20" viewBox="0 0 20 20"><circle cx="4" cy="10" r="1.6" fill="currentColor"/><circle cx="10" cy="10" r="1.6" fill="currentColor"/><circle cx="16" cy="10" r="1.6" fill="currentColor"/></svg></button></div>
  ${S.flags.priceUp && p.link ? `<div class="note">Цена по ссылке изменилась: была ${rubT(p.price)}, стала ${rubT(p.price + 6000)}. <div class="kb"><button data-act="priceRecalc">Пересчитать</button><button data-act="priceKeep">Оставить</button></div></div>` : ''}
  ${S.flags.partnerStep ? `<div class="note">${NAME[o]} сегодня ${o === 'anya' ? 'сделала' : 'сделал'} шаг. ${S.people[w].stepped ? 'Общий кадр этой недели — ваш.' : 'Отложите и вы — получится общий кадр.'}<div class="kb"><button data-act="cheer">Подбодрить</button></div></div>` : ''}
  <div class="cardp"><div class="photo" data-pic="${p.photo}" data-pct="${pc}" data-conf="${confPct(p, w)}" data-step="${mine / Math.max(1, p.share[w])}" role="img" aria-label="Фото цели: чёткая часть — отложено, в тумане — впереди">
    <img class="fog" alt=""><img class="color" alt=""><div class="thin"></div><div class="edge"></div><div class="rule"></div><div class="band"></div><div class="bandlab num">отложено</div><span class="pctlab num">отложено ${Math.round(pc * 100)}${NB}%</span>
    ${ml ? `<span class="mile${S.flash ? ' pop' : ''}">${ml[1]}</span>` : ''}<button class="swap press" data-sheet="photo">Сменить фото</button></div>
    <div class="cap"><span class="hand">${esc(p.cap || p.name)}</span><span class="stamp${oStat === 'нужна помощь' ? ' help' : ''}">${NAME[o]}: ${oStat}${oStat === 'по плану' || oStat === 'нужна помощь' ? `<small>${confOk(p, o) ? 'подтверждено выпиской' : 'по отметкам'}</small>` : ''}</span></div></div>
  ${p.state === 'done' ? `<p class="left disp">Собрано</p><div class="note">Деньги у вас. Собрать их можно копилкой или сбором в своём банке. Мы деньги не храним.</div>`
  : `<p class="left disp"><small>Осталось отложить ${vis('me')}</small><span class="num" data-out="my-left">${rub(leftOf(p, w))}</span></p>
  <p class="mut" style="margin:0">${paydaySum(w) ? 'С зарплаты ≈ <span class="num">' + rub(paydaySum(w)) + '</span> · ' : ''}${plan ? 'по плану' : 'догнать план'}: <span class="num" data-out="perday">${rub(mine)}</span> в день</p>
  <p class="xs mut" style="margin:6px 0 0">${(p.saved[w] || 0) === 0 ? 'Отметок пока нет' : ((p.conf || {})[w] || 0) >= p.saved[w] ? 'Всё подтверждено выпиской' : 'Подтверждено ' + rubT((p.conf || {})[w] || 0) + ' из ' + rubT(p.saved[w])} <button class="link sm" data-sheet="how" style="min-height:0" aria-label="Как читать фото и неделю">Как это работает?</button></p>`}
  ${p.state === 'done' ? '' : `<div class="filmlab"><span>Неделя: ${steps} из 7</span><span>ещё ${Math.ceil(daysTo(p) / 7)} ${plural(Math.ceil(daysTo(p) / 7), 'неделя', 'недели', 'недель')}</span></div>
  <div class="film" role="img" aria-label="Дней с отметкой на этой неделе: ${steps} из 7">${Array.from({length:7}, (_, i) => `<div class="fr" style="--r:${i < steps ? 0 : 100}%"></div>`).join('')}</div>

  <div class="sec"><h2>До полной суммы ${vis('all')}</h2>${over ? `<div class="rowl"><span>Вдвоём вносите на ${rubT(over)} больше цены.</span><button class="chip press" data-sheet="change">Уменьшить часть</button></div>`
   : gap && !S.stmtFound ? `<div class="rowl"><span>Не хватает <b class="num" data-out="gap">${rubT(gap)}</b></span><button class="chip press" data-act="toStmt">Найти в своих тратах</button></div>`
   : gap ? `<div class="rowl"><span><b>Сходится.</b> ${w === 'oleg' ? 'Недостающее нашлось в ваших тратах.' : 'Недостающее нашлось.'}</span>${w === 'oleg' ? '<button class="chip press" data-go="stmtResult">Советы</button>' : ''}</div>`
   : `<div class="rowl"><span><b>Сходится</b> к ${dStr(p.dl)}</span></div>`}
   <details><summary>Цена, части, где деньги</summary><div class="rowl"><span>Цена</span><b class="num">${rubT(p.price)}</b></div><div class="rowl"><span>Ваша часть · часть партнёра</span><b class="num">${rubT(p.share[w])} · ${p.share[o] != null ? rubT(p.share[o]) : '—'}</b></div>
   <div class="rowl"><span>Где лежат ваши деньги ${vis('me')}<br><b>${(p.where || {})[w] || 'не указано'}</b></span><button class="chip press sm" data-sheet="where">${(p.where || {})[w] ? 'Изменить' : 'Указать'}</button></div>

  main: p.state === 'done' ? null : ['Я отложил(а)', 'saveSheet']}; }

function scrUsed(){ return {notabs:true, html:`<h1 class="h1 disp">Приглашение уже использовано</h1><p>По этой ссылке покупку уже принял другой человек. Попросите прислать новую ссылку.</p><p class="mut sm">Владельцу покупки мы сообщили — он может отозвать приглашение.</p>`}; }

function scrIncome(){ return {notabs:true, html:`${backBtn('today')}<h1 class="h1 disp">Приходы и обязательные траты</h1><p class="mut">Одной фразой: сколько получаете, в какие дни и сколько уходит на обязательное. ${vis('me')}</p>

function scrToday(){ const w = S.who, m = me(); if (!m.income) return scrSource();

function scrStmtResult(){ const p = active('oleg')[0], gap = p ? gapOf(p) : 0, fs = p ? foundSum(p) : 0, dl = p ? dStr(p.dl) : '';
  if (S.who !== 'oleg' || !S.people.oleg.stmt) return {html:`<h1 class="h1 disp">Выписка</h1><p>Здесь появится разбор вашей выписки. Он виден только вам.</p><button class="sec2 press" data-go="stmtIntro">Загрузить выписку</button>`};
  return {html:`${backBtn('today', 'Сегодня')}<p class="xs mut">Выписка 1 июля – 30 сентября ${vis('me')}</p>
  ${!p ? `<h1 class="h1 disp">В тратах можно освободить <span class="num">${rubT(TIPS.reduce((s, t, i) => s + (S.stmtTips[i] ? t[1] : 0), 0))}</span> в месяц</h1><button class="sec2 press" data-go="phrase">Добавить покупку</button>`
   : gap ? (fs >= gap ? `<h1 class="h1 disp">Сходится — недостающие <span class="num">${rubT(gap)}</span> нашлись в ваших же тратах</h1><p class="mut">К ${dl} наберётся ≈ <b class="num" data-out="found">${rubT(fs)}</b> — на ${rubT(fs - gap)} больше нужного.</p>`
     : `<h1 class="h1 disp">Не хватает ещё <span class="num">${rubT(gap - fs)}</span></h1><p class="mut">Советы дают <b class="num" data-out="found">${rubT(fs)}</b> к ${dl}. Можно сдвинуть срок в «Изменить покупку».</p>`)
   : `<h1 class="h1 disp">Покупка сходится</h1><p class="mut">Советы ниже — запас: ≈ <b class="num" data-out="found">${rubT(fs)}</b> к ${dl}.</p>`}
  <div class="sec"><h2>Советы</h2>${TIPS.map((t, i) => `<label class="tip"><input type="checkbox" data-tip="${i}" ${S.stmtTips[i] ? 'checked' : ''}><span>${t[0]}<br><span class="xs mut">${rubT(t[1])} в месяц</span></span><b class="num">${p ? rubT(tipTo(t[1], p)) : ''}</b></label>`).join('')}</div>
  <div class="sec"><h2>Нужен ваш ответ</h2><div class="rowl" style="flex-wrap:wrap"><span>От [человек]: 12 000 ₽ — ${S.petr ? S.petr : 'это доход?'}</span>${S.petr ? '' : '<span class="kb" style="margin:0"><button data-petr="вернули долг">Вернули долг</button><button data-petr="партнёр скинулся">Партнёр скинулся</button><button data-petr="это доход">Это доход</button></span>'}</div></div>
  <details><summary>Подробности выписки</summary><div class="sec"><h2>Подписки</h2><div class="rowl"><span>Кинопоиск</span><b class="num">399 ₽</b></div><div class="rowl"><span>Иви</span><b class="num">299 ₽</b></div><div class="rowl"><span>Яндекс Плюс</span><b class="num">299 ₽</b></div><p class="xs mut">Всего 997 ₽ в месяц.</p></div>
  <div class="sec"><h2>Что заметно</h2><p>По пятницам тратите в 1,6 раза больше обычного.</p><p>В первые три дня после зарплаты уходит 31 % трат месяца.</p></div>
  <details><summary>Куда уходят деньги в месяц</summary><div class="sm">${[['Продукты','18 400'],['Доставка еды','9 800'],['Маркетплейсы','6 000'],['Кафе и кофе','5 200'],['Такси','3 100'],['Подписки','997']].map(r => `<div class="rowl"><span>${r[0]}</span><b class="num">${r[1].replace(' ', NB)} ₽</b></div>`).join('')}</div></details>
  <div class="sec"><h2>Обязательные</h2><p>Считаю обязательными: ЖКУ, связь и интернет, кредит — 30 000 ₽ в месяц. <button class="link sm" data-sheet="feedback" style="min-height:0">Что-то лишнее?</button></p></div>
  <div class="sec"><h2>Что не считал доходом и тратой</h2>
   <div class="rowl"><span>Переводы между своими счетами: 20 000 ₽</span></div>
   ${!p ? '' : S.recon ? `<div class="rowl" style="flex-wrap:wrap"><span>Отмечено ${rubT(S.recon.marked)}, а в копилку по выписке ушло ${rubT(S.recon.seen)}.</span><span class="kb" style="margin:0"><button data-act="reconFix">Поправить отметки</button><button data-act="reconKeep">Остальное лежит в другом месте</button></span></div>`
     : `<div class="rowl"><span>В копилку и на вклады: ${rubT((p.conf || {}).oleg || 0)} — ${((p.conf || {}).oleg || 0) >= p.saved.oleg ? 'отметки подтверждены' : 'это подтверждённая часть отметок'}.</span></div>`}
   <p class="xs mut" style="margin-top:6px">Скрыто номеров карт, телефонов и имён: 14. Возвратов: 2. Дублей: 1. Обновить — после зарплаты 10 октября.</p></div></details>`, main:['Считать «Сегодня» по выписке','stmtUse']}; }

function scrData(){ const m = me(); return {html:`<div class="head"><h1 class="disp">Мои данные</h1></div><p class="mut sm">Только для вас ${vis('me')}</p>
  <div class="sec"><h2>Что храним</h2><div class="rowl"><span>Покупки, части, отметки</span></div><div class="rowl"><span>Приходы</span><span class="mut sm">${m.income ? (m.income.src === 'stmt' ? 'из выписки' : 'вписаны') : 'нет'}</span></div>
   <div class="rowl"><span>Сводка выписки</span>${S.who === 'oleg' && m.stmt ? '<button class="chip press sm" data-act="delStmt">Удалить</button>' : '<span class="mut sm">нет</span>'}</div></div>
  <div class="sec"><h2>Напоминания</h2><div class="rowl"><span>${m.bot ? 'Бот в ' + (m.bot === 'max' ? 'Max' : 'Telegram') : 'Не подключены'}</span>${m.bot ? '<button class="chip press sm" data-go="bot">Открыть</button><button class="chip press sm" data-act="botStop">Отключить</button>' : '<button class="chip press sm" data-sheet="remind">Подключить</button>'}</div></div>
  <div class="sec"><h2>Доступ</h2><div class="rowl"><span>На главный экран</span><button class="chip press sm" data-sheet="install">Как</button></div>
   <div class="rowl"><span>${m.email ? 'Почта привязана' : 'Только на этом телефоне'}</span>${m.email ? '' : '<button class="chip press sm" data-sheet="email">Привязать почту</button>'}</div></div>
  <div class="sec"><button class="link" data-sheet="policy">Как храним данные</button><br><button class="link" data-sheet="delAsk" style="color:var(--warm)">Удалить мои данные</button></div>`}; }
function scrDeleted(){ return {notabs:true, html:`<h1 class="h1 disp">Данные удалены</h1><p>Покупки, части, отметки, приходы, траты, сводка выписки и связь с ботом удалены. ${S.purchases.length ? 'У партнёра покупка осталась с пометкой «вышел».' : ''}</p>`, main:['Начать заново','restart']}; }

function botHello(w){ const tg = me().bot === 'tg' || S.flags.tg; return tg
  ? [{b:'Подключено. Пишу по утрам и в день зарплаты — без сумм: деньги показываю только в приложении. Партнёр этот чат не видит.', kb:[['Открыть приложение','go:today']]},
     {b:'Доброе утро! Посмотрите, сколько сегодня можно на себя.', kb:[['Открыть приложение','go:today']]}]
  : [{b:'Подключено. Утром — сколько на себя, в день зарплаты — сколько отложить. Траты пишите сюда: «кофе 300». Партнёр чат не видит.'},
     {b:morningText(w), out:'bot-morning', sub:true, kb:[['Записать трату','hint:spend'],['Влезет ли покупка?','hint:aff']]}]; }
function morningText(w){ const p = active(w)[0]; return 'Доброе утро! Сегодня на себя ' + rubT(selfDay(w)) + (p ? '. «' + p.name + '»: ' + (onPlan(p, w) ? 'вы по плану' : 'можно догнать') + (nextPay(w, now()) ? ', с зарплаты ' + dStr(nextPay(w, now())) + ' — отложить ≈ ' + rubT(paydaySum(w)) + '.' : '.') : '.'); }
function scrBot(){ const w = S.who, m = me(), tg = m.bot === 'tg';
  const msgs = botHello(w).concat(m.chat);
  if (S.flags.push || S.off === 9) msgs.push(paydayMsg(w, tg));
  return {notabs:true, html:`<div class="chathead">${backBtn('today', '')}<span class="ava">₽</span><span><b>Покупка к дате</b><br><span class="xs mut">бот в ${tg ? 'Telegram · без сумм' : 'Max'}</span></span>
   <span style="flex:1"></span><div class="seg" style="width:120px"><button data-bot="max" aria-pressed="${!tg}">Max</button><button data-bot="tg" aria-pressed="${tg}">TG</button></div></div>
  <div class="chat">${msgs.map(x => x.me ? `<div class="bub me">${esc(x.me)}</div>` : `<div class="bub"><span${x.out ? ` data-out="${x.out}"` : ''}>${x.b}</span>${x.sub ? '<small>текст — GigaChat, числа — расчёт программы</small>' : ''}${x.kb ? `<div class="kb">${x.kb.map(k => `<button data-kb="${k[1]}">${k[0]}</button>`).join('')}</div>` : ''}</div>`).join('')}</div>
  <form class="field" id="botf" style="position:sticky;bottom:-80px;margin-top:14px;background:var(--bg);padding:8px 0"><input class="inp" id="botin" placeholder="${tg ? 'сообщение' : 'кофе 300 · влезет ли ужин за 3000?'}" aria-label="Сообщение боту"><button class="go press">›</button></form>`}; }
const paydayMsg = (w, tg) => tg ? {b:'Зарплата пришла. Откройте приложение — там сумма, которую стоит отложить.', kb:[['Открыть приложение','go:purchase']]}
  : {b:'Зарплата пришла — отложите ≈ ' + rubT(paydaySum(w)), out:'bot-payday', sub:true, kb:[['Отложил','payStep'],['Вечером','later']]};
function botSay(text){ const w = S.who, m = me(), tg = m.bot === 'tg'; m.chat.push({me:text});
  const v = numIn(text.replace(/\d{1,2}\s*числ/g, ''));
  if (tg) m.chat.push({b:'В Telegram суммы не записываю. Трату и «влезет ли» — в приложении.', kb:[['Открыть приложение','go:today']]});
  else if (!v) m.chat.push({b:'Не нашёл сумму. Напишите, например, «такси 450» или «влезет ли ужин за 3000?»'});
  else if (/влез|можно ли|хватит/i.test(text)) { const a = afford(w, v); m.chat.push({b:a.t, sub:true, out:'afford', kb: a.k === 'no' ? null : [['Купил — записать','buy:' + v],['Не буду','later']]}); }
  else { const t = text.replace(/[\d\s₽]+/g, ' ').trim(); m.spent.push({v, t}); m.chat.push({b:'Записал: ' + (t || 'трата') + ' — ' + rubT(v) + '. Сегодня на себя ' + (leftToday(w) < 0 ? 'потрачено больше плана на ' + rubT(-leftToday(w)) : 'осталось ' + rubT(leftToday(w))), sub:true, kb:[['Отменить','undoLast']]}); }
}

const SH = {
  how: () => `<h3 class="disp">Как читать фото</h3><p class="sm"><b>Чётко</b> — подтверждено выпиской. <b>Дымка</b> — по вашим отметкам. <b>Туман</b> — ещё впереди.</p><p class="sm">День засчитан, если отложили с зарплаты или отправили остаток дня. Кадр недели — 5 дней из 7. Пропуск ничего не отнимает. Точка — день у обоих.</p><button class="sec2 press" data-act="closeS">Понятно</button>`,
  askq: () => `<h3 class="disp">Как вы решали последнюю крупную покупку?</h3><div class="chips">${['Обсудили и скинулись','Купил(а) сам(а)','Взяли в рассрочку','Долго откладывали','Спорили'].map(a => `<button class="chip press sm" data-act="askedS">${a}</button>`).join('')}<button class="chip press sm" data-act="askedS">Пропустить</button></div>`,
  policy: () => `<h3 class="disp">Как мы обращаемся с данными</h3><p>Аккаунт — на этом устройстве, без телефона и почты.</p><p>GigaChat видит фразы без номеров карт и телефонов.</p><p>Файл выписки удаляется сразу, остаётся сводка.</p><p>Партнёр видит покупку и свою часть, но не ваши деньги.</p><p>Хранение — в России, 12 месяцев. Удалить всё — в «Моих данных».</p><button class="main press" data-close>Понятно</button>`,
  save: () => { const p = P(), w = S.who, ps = paydaySum(w), v = Math.min(leftOf(p, w), ps || perDay(p, w)), rest = me().income && !me().sentRest ? leftToday(w) : 0; return `<h3 class="disp">Сколько отложили</h3><form id="savef" class="field"><input class="inp" id="saveamt" inputmode="numeric" value="${fmt(v)}" aria-label="Сумма"><button class="go press">Записать</button></form><div class="chips">${ps ? `<button class="chip press num" data-saveamt="${Math.min(leftOf(p, w), ps)}">с зарплаты ${rubT(Math.min(leftOf(p, w), ps))}</button>` : ''}${rest > 0 ? `<button class="chip press num" data-act="rest">остаток дня ${rubT(rest)}</button>` : ''}</div><p class="xs mut" style="margin-top:8px">Мы не переводим деньги: отметка — для вашего плана. Партнёр увидит только «по плану».</p>`; },
  change: () => `<h3 class="disp">Изменить покупку</h3><button class="sec2 press" data-input="share">Поменять свою часть</button><button class="sec2 press" data-input="dl">Перенести срок</button><button class="sec2 press" data-input="took">Пришлось взять из отложенного</button><button class="sec2 press" data-sheet="cancelAsk" style="color:var(--warm)">Отменить покупку</button><p class="xs mut" style="margin-top:8px">Партнёр увидит новый статус без причин и без ваших сумм.</p>`,
  input: k => { const t = {share:['Ваша часть, ₽','например, 80 000'], dl:['Новый срок','например, к 31 января'], took:['Сколько взяли из отложенного, ₽','например, 3 000']}[k]; return `<h3 class="disp">${t[0]}</h3><form id="inputf" data-k="${k}" class="field"><input class="inp" id="inputv" placeholder="${t[1]}" aria-label="${t[0]}"><button class="go press">Готово</button></form>${k === 'took' ? '<p class="xs mut" style="margin-top:8px">Бывает. Пересчитаю план и предложу срок без упрёков.</p>' : ''}`; },
  cancelAsk: () => `<h3 class="disp">Отменить покупку?</h3><p>Покупка уйдёт в архив у вас и у партнёра. Отметки сохранятся.</p><button class="main press p-danger" data-act="cancelBuy">Отменить покупку</button><button class="sec2 press" data-close>Оставить</button>`,
  delAsk: () => `<h3 class="disp">Удалить все данные?</h3><p>Покупки, части, отложенное, приходы, траты, сводка выписки и связь с ботом исчезнут. Вернуть нельзя.</p><button class="main press p-danger" data-act="delAll">Удалить всё</button><button class="sec2 press" data-close>Оставить</button>`,
  remind: () => `<h3 class="disp">Где напоминать?</h3><button class="sec2 press" data-act="linkMax" style="text-align:left;padding:10px 14px;min-height:64px"><b>В Max</b><br><span class="mut sm">траты и «влезет ли» в чате</span></button><button class="sec2 press" data-act="linkTg" style="text-align:left;padding:10px 14px;min-height:64px"><b>В Telegram</b><br><span class="mut sm">только напоминания, без сумм</span></button>
   <label class="tip"><input type="checkbox" checked><span>Утром — сколько на себя</span></label><label class="tip"><input type="checkbox" checked><span>Ежемесячно — выписка</span></label>
   <p class="xs mut" style="margin-top:8px">Чат видите только вы.</p>
   <details><summary>Или уведомлением на телефоне</summary><p class="sm">1. Добавьте приложение на главный экран. 2. Разрешите уведомления.</p><button class="sec2 press" data-act="linkPush">Разрешить уведомления</button></details>`,
  install: () => `<h3 class="disp">На главный экран</h3><p>iPhone: «Поделиться» → «На экран Домой».</p><p>Android: меню браузера → «Добавить на главный экран».</p><p class="mut sm">Так приложение открывается одним касанием и может присылать уведомления.</p><button class="main press" data-close>Понятно</button>`,
  email: () => S.emailStep ? `<h3 class="disp">Код из письма</h3><p class="mut sm">Отправили код на почту. Введите четыре цифры.</p><form id="codef" class="field"><input class="inp" inputmode="numeric" maxlength="4" placeholder="0000" aria-label="Код из письма"><button class="go press">Готово</button></form>`
    : `<h3 class="disp">Сохранить по почте</h3><p>Сейчас данные живут на этом телефоне. Привяжите почту — и они не пропадут при смене устройства.</p><form id="emailf" class="field"><input class="inp" type="email" placeholder="почта" aria-label="Почта"><button class="go press">Код</button></form>`,
  shot: () => `<h3 class="disp">Трата скриншотом</h3><p>Пришлите скриншот уведомления банка — распознаю сумму на своём сервере в России и попрошу подтвердить.</p><button class="sec2 press" data-act="shotDemo">Взять пример: «Покупка 1 250 ₽, Пятёрочка»</button>`,
  feedback: () => `<h3 class="disp">Что не так?</h3><form id="fbf"><textarea class="inp" aria-label="Что не так" placeholder="Напишите в двух словах"></textarea><button class="main press" style="margin-top:10px">Отправить</button></form>`,
  feedbackOk: () => `<h3 class="disp">Спасибо, отправлено</h3><p>Читаем каждый отзыв и исправляем.</p><button class="main press" data-close>Закрыть</button>`,

const v3mon = t => t - ((new Date(t).getUTCDay() + 6) % 7) * DAY;
/* отметки этой недели по цели: дни до создания цели не считаются (у новой цели нет «1 неделя по плану») */
function v3wkMarks(p, w){ const d = weekRow(w).html.split('<div class="wd').slice(1), st = v3mon(p.cr) === v3mon(now()) ? (new Date(p.cr).getUTCDay() + 6) % 7 : 0;
  return d.filter((x, i) => i >= st && /^ on/.test(x)).length; }
function v3weeks(p, w){ const m0 = v3mon(p.cr), total = Math.max(1, Math.round((v3mon(p.dl) - m0) / V3_WEEK) + 1),
    ci = Math.min(total - 1, Math.max(0, Math.round((v3mon(now()) - m0) / V3_WEEK)));
  let past = (p.v3wk || {})[w];
  const none = !past && !((p.saved[w] || 0) > 0) && p.state !== 'done';   /* до первой отметки считать нечего */
  if (!past) {   /* истории нет — доля недель по плану из отложенного против плана; пропуски разнесены равномерно */
    const tot = Math.max(1, Math.round((p.dl - p.cr) / DAY)), el = Math.max(1, Math.round((now() - p.cr) / DAY)), exp = (p.share[w] || 0) * el / tot,
      k = Math.round(ci * Math.min(1, exp > 0 ? (p.saved[w] || 0) / exp : 1)), miss = ci - k;
    past = Array.from({length:ci}, (_, j) => Math.floor((j + 1) * miss / ci) === Math.floor(j * miss / ci)); }
  past = Array.from({length:ci}, (_, j) => !!past[j]);
  const cur = p.state === 'done' || (!none && onPlan(p, w) && v3wkMarks(p, w) > 0), cells = past.concat([cur]);
  return {cells, ci, total, none, n:cells.filter(Boolean).length}; }

/* line — на экране уже есть v2-плёнка недели: одна строка вместо третьей полоски */

  const fut = Math.max(0, k.total - k.ci - 1), from = Math.max(0, k.cells.length - V3_WKMAX),

/* ── M-E: срыв без обнуления — две равные дороги ──
